# Note: Variables accessed from from_secret environment blocks use single $
# as normal — Woodpecker injects them as real container env vars, not string
# substitutions. $$ is only needed for inline YAML string expressions where
# the Woodpecker pre-processor would evaluate $VAR at parse time.

skip_clone: true

variables:
  - &deploy_image alpine

  - &deploy_commands
    - apk add --no-cache openssh-client bash
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
    - ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
    - |
      ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" bash -s -- \
        "$NODE_ENV" \
        "$DEPLOY_BASE_DIR" \
        "$GIT_DIR" \
        "$REPO_SLUG" \
        "$REPO_BRANCH" \
        "$PNPM_VERSION" \
        "$SUBDOMAIN_DIR" \
        "$VITE_APP_URL" \
        "$VITE_BUILD_MODE" \
        "$GH_TOKEN" <<'ENDSSH'
        set -euo pipefail

        NODE_ENV="$1"
        DEPLOY_BASE_DIR="$2"
        GIT_DIR="$3"
        REPO_SLUG="$4"
        REPO_BRANCH="$5"
        PNPM_VERSION="$6"
        SUBDOMAIN_DIR="$7"
        VITE_APP_URL="$8"
        VITE_BUILD_MODE="$9"
        GH_TOKEN="${10}"

        echo "REMOTE_CHECK NODE_ENV=$NODE_ENV"
        echo "REMOTE_CHECK REPO_SLUG=$REPO_SLUG"
        echo "REMOTE_CHECK GH_TOKEN=$([ -n "$GH_TOKEN" ] && echo '<set>' || echo '<EMPTY>')"
        [ -n "$NODE_ENV" ]        || { echo "REMOTE FAIL: NODE_ENV empty"; exit 1; }
        [ -n "$DEPLOY_BASE_DIR" ] || { echo "REMOTE FAIL: DEPLOY_BASE_DIR empty"; exit 1; }
        [ -n "$GIT_DIR" ]         || { echo "REMOTE FAIL: GIT_DIR empty"; exit 1; }
        [ -n "$REPO_SLUG" ]       || { echo "REMOTE FAIL: REPO_SLUG empty"; exit 1; }
        [ -n "$REPO_BRANCH" ]     || { echo "REMOTE FAIL: REPO_BRANCH empty"; exit 1; }
        [ -n "$PNPM_VERSION" ]    || { echo "REMOTE FAIL: PNPM_VERSION empty"; exit 1; }
        [ -n "$SUBDOMAIN_DIR" ]   || { echo "REMOTE FAIL: SUBDOMAIN_DIR empty"; exit 1; }
        [ -n "$VITE_APP_URL" ]    || { echo "REMOTE FAIL: VITE_APP_URL empty"; exit 1; }
        [ -n "$VITE_BUILD_MODE" ] || { echo "REMOTE FAIL: VITE_BUILD_MODE empty"; exit 1; }
        [ -n "$GH_TOKEN" ]        || { echo "REMOTE FAIL: GH_TOKEN empty"; exit 1; }

        source ~/.bash_profile
        source ~/.nvm/nvm.sh

        DEPLOY_PATH="$DEPLOY_BASE_DIR/$GIT_DIR"
        TARGET_PATH="$DEPLOY_BASE_DIR/$SUBDOMAIN_DIR"
        BACKUP_DIR="$(mktemp -d)"

        mkdir -p "$DEPLOY_BASE_DIR"

        if [ -d "$DEPLOY_PATH" ]; then
          find "$DEPLOY_PATH" -maxdepth 1 -type f \( -name '.env' -o -name '.env.*' \) \
            -exec cp -a {} "$BACKUP_DIR"/ \;
          rm -rf "$DEPLOY_PATH"
        fi

        GIT_TERMINAL_PROMPT=0 \
          git clone --no-recurse-submodules \
            "https://x-access-token:$GH_TOKEN@github.com/$REPO_SLUG.git" \
            "$DEPLOY_PATH" -b "$REPO_BRANCH"

        cd "$DEPLOY_PATH"

        find "$BACKUP_DIR" -maxdepth 1 -type f \( -name '.env' -o -name '.env.*' \) \
          -exec mv {} "$DEPLOY_PATH"/ \;

        rmdir "$BACKUP_DIR" 2>/dev/null || true

        corepack enable
        corepack use "pnpm@$PNPM_VERSION"

        pnpm install --frozen-lockfile < /dev/null
        rm -rf ./dist
        VITE_APP_URL="$VITE_APP_URL" pnpm build --mode "$VITE_BUILD_MODE" < /dev/null

        test -d ./dist  || { echo "FAIL: build output dist/ missing"; exit 1; }
        test -f ./dist/index.html || { echo "FAIL: dist/index.html missing"; exit 1; }

        mkdir -p "$TARGET_PATH"
        rsync -avz --delete ./dist/ "$TARGET_PATH/"
      ENDSSH

  - &deploy_base_env
    SSH_HOST: 217.160.14.123
    SSH_USER:
      from_secret: ssh_user
    DEPLOY_BASE_DIR:
      from_secret: deploy_base_dir
    REPO_SLUG: BabaDeluxe/babadeluxe-webview
    PNPM_VERSION: 9.15.0
    DEPLOY_SSH_KEY:
      from_secret: deploy_ssh_key
    GH_TOKEN:
      from_secret: gh_token

  - &deploy_base_secrets
    - ssh_user
    - deploy_base_dir
    - deploy_ssh_key
    - gh_token

steps:
  deploy-prod:
    image: *deploy_image
    when:
      - event: [push, manual]
        branch: master
    secrets: *deploy_base_secrets
    environment:
      <<: *deploy_base_env
      NODE_ENV: production
      VITE_BUILD_MODE: production
      REPO_BRANCH: master
      GIT_DIR: babadeluxe-webview-prod
      SUBDOMAIN_DIR: app.babadeluxe.com
      VITE_APP_URL: https://app.babadeluxe.com
    commands: *deploy_commands

  deploy-staging:
    image: *deploy_image
    when:
      - event: [push, manual]
        branch: dev
    secrets: *deploy_base_secrets
    environment:
      <<: *deploy_base_env
      NODE_ENV: staging
      VITE_BUILD_MODE: staging
      REPO_BRANCH: dev
      GIT_DIR: babadeluxe-webview-staging
      SUBDOMAIN_DIR: app-staging.babadeluxe.com
      VITE_APP_URL: https://app-staging.babadeluxe.com
    commands: *deploy_commands
