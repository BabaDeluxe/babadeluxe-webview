skip_clone: true

variables:
  - &deploy_image alpine

  - &deploy_commands
    - apk add --no-cache openssh-client bash
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
    - ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
    - |
      ssh -i ~/.ssh/id_deploy "$SSH_USER@$SSH_HOST" bash -s -- \
        "$NODE_ENV" \
        "$DEPLOY_BASE_DIR" \
        "$GIT_DIR" \
        "$REPO_SLUG" \
        "$REPO_BRANCH" \
        "$PNPM_VERSION" \
        "$SUBDOMAIN_DIR" \
        "$VITE_APP_URL" \
        "$VITE_BUILD_MODE" \
        "$GH_TOKEN" <<'ENDSSH'
        set -euo pipefail

        NODE_ENV="$1"
        DEPLOY_BASE_DIR="$2"
        GIT_DIR="$3"
        REPO_SLUG="$4"
        REPO_BRANCH="$5"
        PNPM_VERSION="$6"
        SUBDOMAIN_DIR="$7"
        VITE_APP_URL="$8"
        VITE_BUILD_MODE="$9"
        GH_TOKEN="${10}"

        source ~/.bash_profile
        source ~/.nvm/nvm.sh

        DEPLOY_PATH="$DEPLOY_BASE_DIR/$GIT_DIR"
        TARGET_PATH="$DEPLOY_BASE_DIR/$SUBDOMAIN_DIR"

        mkdir -p "$DEPLOY_BASE_DIR"

        clone_with_fallbacks() {
          local slug="$1"
          local path="$2"
          local branch="$3"

          echo "DEPLOY_VARIANT=primary-gh"
          if gh repo clone "$slug" "$path" -- -b "$branch"; then
            return 0
          fi
          echo "DEPLOY_VARIANT_FAILED=primary-gh"

          echo "DEPLOY_VARIANT=fallback-git-token"
          if GH_TOKEN="$GH_TOKEN" git clone "https://x-access-token:${GH_TOKEN}@github.com/${slug}.git" "$path" -b "$branch"; then
            return 0
          fi
          echo "DEPLOY_VARIANT_FAILED=fallback-git-token"

          echo "DEPLOY_VARIANT=fallback-server-gh-auth"
          if echo "$GH_TOKEN" | gh auth login --with-token && gh repo clone "$slug" "$path" -- -b "$branch"; then
            return 0
          fi
          echo "DEPLOY_VARIANT_FAILED=fallback-server-gh-auth"

          echo "DEPLOY_CLONE_ERROR=all variants exhausted for $slug"
          return 1
        }

        if [ ! -d "$DEPLOY_PATH/.git" ]; then
          clone_with_fallbacks "$REPO_SLUG" "$DEPLOY_PATH" "$REPO_BRANCH"
        fi

        cd "$DEPLOY_PATH"

        git fetch origin "$REPO_BRANCH"
        git checkout "$REPO_BRANCH"
        git reset --hard "origin/$REPO_BRANCH"

        corepack enable
        corepack use "pnpm@$PNPM_VERSION"

        pnpm install --frozen-lockfile < /dev/null
        rm -rf ./dist
        VITE_APP_URL="$VITE_APP_URL" pnpm build --mode "$VITE_BUILD_MODE" < /dev/null

        test -d ./dist
        test -f ./dist/index.html

        mkdir -p "$TARGET_PATH"
        rsync -avz --delete ./dist/ "$TARGET_PATH/"
      ENDSSH

  - &deploy_base_env
    SSH_HOST: 217.160.14.123
    SSH_USER:
      from_secret: ssh_user
    DEPLOY_BASE_DIR:
      from_secret: deploy_base_dir
    REPO_SLUG: BabaDeluxe/babadeluxe-webview
    PNPM_VERSION: 9.15.0
    DEPLOY_SSH_KEY:
      from_secret: deploy_ssh_key
    GH_TOKEN:
      from_secret: gh_token

steps:
  deploy-prod:
    image: *deploy_image
    when:
      - event: [push, manual]
        branch: master
    environment:
      <<: *deploy_base_env
      NODE_ENV: production
      VITE_BUILD_MODE: production
      REPO_BRANCH: master
      GIT_DIR: babadeluxe-webview-prod
      SUBDOMAIN_DIR: app.babadeluxe.com
      VITE_APP_URL: https://app.babadeluxe.com
    commands: *deploy_commands

  deploy-staging:
    image: *deploy_image
    when:
      - event: [push, manual]
        branch: dev
    environment:
      <<: *deploy_base_env
      NODE_ENV: staging
      VITE_BUILD_MODE: staging
      REPO_BRANCH: dev
      GIT_DIR: babadeluxe-webview-staging
      SUBDOMAIN_DIR: app-staging.babadeluxe.com
      VITE_APP_URL: https://app-staging.babadeluxe.com
    commands: *deploy_commands
